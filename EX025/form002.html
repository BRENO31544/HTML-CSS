<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <!--autocomplete "on" libera opções de autocomplete mais específicas nos input's-->
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="25" placeholder="Nome do Usuário" autocomplete="username">
        </p>
        <!--required: faz com que o campo seja obrigatório-->
        <!--minlenght="5": faz com que o tamanho minimo do imput de entrada seja 5 caracteres-->
        <!--maxlenght="15": faz com que o tmaanho maximo do input de entrada seja 15 caracteres-->
        <!--seze="25": faz com que o tamanho máximo do campo seja de 25 caracteres (não tem problema se o input form maior que isso, aenas não será exibido)-->
        <!--Placeholder="Nome de Usuário" Faz com que apareça um dica do que escreve dentro do campo-->
        <!--autocomplete="username" fazz com que apareça para autocompletar apenas usernames-->
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="35" placeholder="Senha do Usuário" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        <!--input's desse tipo precisão do "value" para descrever o que deve estar escrito no botão-->
        </p>
    </form>
</body>
</html>
